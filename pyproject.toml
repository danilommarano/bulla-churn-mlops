[project]
name = "churn"
version = "0.1.0"
description = "Local MLOps pipeline for customer churn prediction (Bulla technical test)"
readme = "README.md"
authors = [
    { name = "Danilo Matrangolo Marano", email = "danilo.m.marano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.11",       # model monitoring / drift reports (Vertex AI Model Monitoring equivalent)
    "fastapi>=0.141.1",
    "feast>=0.54",
    "kfp>=2.17.0",              # local pipeline orchestration (Vertex AI Pipelines equivalent)
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "pandas>=2.2,<3",
    "pandera[pandas]>=0.22",
    "pip>=26.2.1",              # kfp local SubprocessRunner shells out to pip (uv venv omits it)
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.30.6,<=0.34.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
