[project]
name = "churn"
version = "0.1.0"
description = "Local MLOps pipeline for customer churn prediction (Bulla technical test)"
readme = "README.md"
authors = [
    { name = "Danilo Matrangolo Marano", email = "danilo.m.marano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "pandas>=2.2,<3",
    "pandera[pandas]>=0.22",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
